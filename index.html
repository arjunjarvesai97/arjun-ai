<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arjun AI - My Personal AI Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin: 15px 5px 0;
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      color: #fbbf24;
      min-height: 25px;
    }

    #aiBox {
      display: none;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Arjun AI</h1>
    <p>My Personal AI Assistant</p>

    <div id="loginBox">

      <h2>Login / Sign Up</h2>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
      >

      <input
        id="password"
        type="password"
        placeholder="Enter password"
      >

      <br>

      <button type="button" id="signupBtn">
        Sign Up
      </button>

      <button type="button" id="loginBtn">
        Login
      </button>

      <div id="message"></div>

    </div>

    <div id="aiBox">

      <h2>Welcome to Arjun AI! 🎉</h2>

      <input
        id="question"
        type="text"
        placeholder="Ask Arjun AI something..."
      >

      <br>

      <button type="button" id="askBtn">
        Ask Arjun AI
      </button>

      <button type="button" id="logoutBtn">
        Logout
      </button>

      <div id="answer"></div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* SUPABASE CONFIG */

    const SUPABASE_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_jaTF9qoveQieLoVNpBm_tg_BdLgm22V";


    /* CREATE SUPABASE CLIENT */

    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ELEMENTS */

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginBox =
      document.getElementById("loginBox");

    const aiBox =
      document.getElementById("aiBox");

    const questionInput =
      document.getElementById("question");

    const answer =
      document.getElementById("answer");


    /* MESSAGE */

    function showMessage(text) {
      message.innerText = text;
    }


    /* SIGN UP */

    async function signUp() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage(
          "Please enter email and password."
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          "Password must be at least 6 characters."
        );
        return;
      }

      showMessage("Creating account...");

      try {

        const { data, error } =
          await client.auth.signUp({
            email: email,
            password: password
          });

        if (error) {
          showMessage(
            "Sign Up Error: " +
            error.message
          );
          return;
        }

        if (data.session) {

          showAI();

        } else {

          showMessage(
            "Account created. Please confirm your email."
          );

        }

      } catch (error) {

        showMessage(
          "Error: " +
          error.message
        );

      }
    }


    /* LOGIN */

    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {
        showMessage(
          "Please enter email and password."
        );
        return;
      }

      showMessage("Logging in...");

      try {

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          showMessage(
            "Login Error: " +
            error.message
          );

          return;
        }

        if (data && data.session) {

          showMessage("");

          showAI();

        } else {

          showMessage(
            "Login failed."
          );

        }

      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );

      }
    }


    /* SHOW AI */

    function showAI() {

      loginBox.style.display =
        "none";

      aiBox.style.display =
        "block";
    }


    /* LOGOUT */

    async function logout() {

      try {

        await client.auth.signOut();

      } catch (error) {

        console.log(error);

      }

      loginBox.style.display =
        "block";

      aiBox.style.display =
        "none";

      passwordInput.value = "";

      questionInput.value = "";

      answer.innerText = "";
    }


    /* CHECK SESSION */

    async function checkUser() {

      try {

        const { data } =
          await client.auth.getSession();

        if (data && data.session) {
          showAI();
        }

      } catch (error) {

        console.log(
          "Session error:",
          error
        );

      }
    }


    /* ASK AI */

    function askAI() {

      const question =
        questionInput.value.trim();

      if (!question) {

        answer.innerText =
          "Please ask me something.";

        return;
      }

      answer.innerText =
        "Hello Arjun! 🤖 I received your question: " +
        question;
    }


    /* BUTTONS */

    document
      .getElementById("signupBtn")
      .addEventListener(
        "click",
        signUp
      );

    document
      .getElementById("loginBtn")
      .addEventListener(
        "click",
        login
      );

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        logout
      );

    document
      .getElementById("askBtn")
      .addEventListener(
        "click",
        askAI
      );


    /* START */

    checkUser();

  </script>

</body>
</html>
