<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arjun AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-top: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #aiBox {
      display: none;
    }

    #message {
      margin-top: 15px;
      color: #fbbf24;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Arjun AI</h1>
    <p>My Personal AI Assistant</p>

    <div id="loginBox">

      <h2>Login / Sign Up</h2>

      <input id="email"
             type="email"
             placeholder="Enter your email">

      <input id="password"
             type="password"
             placeholder="Enter password">

      <br>

      <button onclick="signUp()">Sign Up</button>
      <button onclick="login()">Login</button>

      <div id="message"></div>

    </div>


    <div id="aiBox">

      <h2>Welcome to Arjun AI! 🎉</h2>

      <input id="question"
             type="text"
             placeholder="Ask Arjun AI something...">

      <br>

      <button onclick="askAI()">Ask Arjun AI</button>
      <button onclick="logout()">Logout</button>

      <div id="answer"></div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co";

    /*
      इथे Supabase मधून नवीन Publishable Key paste कर.
    */
    const SUPABASE_KEY =
      "PASTE_NEW_PUBLISHABLE_KEY_HERE";
sb_publishable_jaTF9qoveQieLoVNpBm_tg_BdLgm22V

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function message(text) {
      document.getElementById("message").innerText = text;
    }


    async function signUp() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        message("Please enter email and password.");
        return;
      }

      message("Creating account...");

      try {

        const { error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

        if (error) {
          message("Sign Up Error: " + error.message);
          return;
        }

        message("Account created successfully!");

      } catch (error) {

        message("Error: " + error.message);
      }
    }


    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        message("Please enter email and password.");
        return;
      }

      message("Logging in...");

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          message("Login Error: " + error.message);
          return;
        }

        if (data.session) {

          message("");

          showAI();

        } else {

          message("Login failed. No session found.");
        }

      } catch (error) {

        message("Connection Error: " + error.message);
      }
    }


    function showAI() {

      document.getElementById("loginBox").style.display =
        "none";

      document.getElementById("aiBox").style.display =
        "block";
    }


    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("loginBox").style.display =
        "block";

      document.getElementById("aiBox").style.display =
        "none";
    }


    async function checkUser() {

      try {

        const { data } =
          await supabaseClient.auth.getSession();

        if (data.session) {
          showAI();
        }

      } catch (error) {

        message("Session Error: " + error.message);
      }
    }


    function askAI() {

      const question =
        document.getElementById("question").value.trim();

      if (!question) {

        document.getElementById("answer").innerText =
          "Please ask me something.";

        return;
      }

      document.getElementById("answer").innerText =
        "Hello Arjun! I received your question: " +
        question;
    }


    checkUser();

  </script>

</body>
</html>
