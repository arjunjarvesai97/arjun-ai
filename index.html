<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Arjun AI - My Personal AI Assistant</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 50px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    p {
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      margin: 15px 5px 0;
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #message {
      margin-top: 18px;
      color: #fbbf24;
      min-height: 24px;
    }

    #aiBox {
      display: none;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
      line-height: 1.5;
    }

  </style>

</head>


<body>


  <div class="box">

    <h1>🤖 Arjun AI</h1>

    <p>
      My Personal AI Assistant
    </p>


    <!-- LOGIN -->

    <div id="loginBox">

      <h2>Login / Sign Up</h2>


      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >


      <br>


      <button
        type="button"
        onclick="signUp()"
      >
        Sign Up
      </button>


      <button
        type="button"
        onclick="login()"
      >
        Login
      </button>


      <div id="message"></div>

    </div>


    <!-- AI -->

    <div id="aiBox">

      <h2>
        Welcome to Arjun AI! 🎉
      </h2>


      <input
        id="question"
        type="text"
        placeholder="Ask Arjun AI something..."
      >


      <br>


      <button
        type="button"
        onclick="askAI()"
      >
        Ask Arjun AI
      </button>


      <button
        type="button"
        onclick="logout()"
      >
        Logout
      </button>


      <div id="answer"></div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /*
    =========================================
    SUPABASE CONFIGURATION
    =========================================
    */

    const SUPABASE_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co";


    const SUPABASE_KEY =
    ;sb_publishable_jaTF9qoveQieLoVNpBm_tg_BdLgm22V


    /*
    =========================================
    CREATE SUPABASE CLIENT
    =========================================
    */

    const arjunSupabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /*
    =========================================
    MESSAGE
    =========================================
    */

    function showMessage(text) {

      document.getElementById(
        "message"
      ).innerText = text;

    }


    /*
    =========================================
    SIGN UP
    =========================================
    */

    async function signUp() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters."
        );

        return;
      }


      showMessage(
        "Creating account..."
      );


      try {

        const {
          data,
          error
        } =
          await arjunSupabase.auth.signUp({

            email: email,

            password: password

          });


        if (error) {

          showMessage(
            "Sign Up Error: " +
            error.message
          );

          return;
        }


        /*
        If email confirmation is enabled,
        Supabase will send confirmation email.
        */

        if (
          data &&
          data.user &&
          !data.session
        ) {

          showMessage(
            "Account created! Please confirm your email."
          );

          return;
        }


        showMessage(
          "Account created successfully!"
        );


      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );

      }

    }


    /*
    =========================================
    LOGIN
    =========================================
    */

    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();


      const password =
        document.getElementById(
          "password"
        ).value;


      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password."
        );

        return;
      }


      showMessage(
        "Logging in..."
      );


      try {

        const {
          data,
          error
        } =
          await arjunSupabase.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          showMessage(
            "Login Error: " +
            error.message
          );

          return;
        }


        if (
          data &&
          data.session
        ) {

          showMessage("");

          showAI();

        } else {

          showMessage(
            "Login failed. No session found."
          );

        }


      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );

      }

    }


    /*
    =========================================
    SHOW AI
    =========================================
    */

    function showAI() {

      document.getElementById(
        "loginBox"
      ).style.display = "none";


      document.getElementById(
        "aiBox"
      ).style.display = "block";

    }


    /*
    =========================================
    LOGOUT
    =========================================
    */

    async function logout() {

      try {

        await arjunSupabase.auth.signOut();

      } catch (error) {

        console.log(
          "Logout error:",
          error
        );

      }


      document.getElementById(
        "loginBox"
      ).style.display = "block";


      document.getElementById(
        "aiBox"
      ).style.display = "none";


      document.getElementById(
        "password"
      ).value = "";

    }


    /*
    =========================================
    CHECK EXISTING SESSION
    =========================================
    */

    async function checkUser() {

      try {

        const {
          data,
          error
        } =
          await arjunSupabase.auth
            .getSession();


        if (error) {

          console.log(
            "Session error:",
            error
          );

          return;
        }


        if (
          data &&
          data.session
        ) {

          showAI();

        }

      } catch (error) {

        console.log(
          "Session error:",
          error
        );

      }

    }


    /*
    =========================================
    ASK AI
    =========================================
    */

    function askAI() {

      const question =
        document.getElementById(
          "question"
        ).value.trim();


      const answer =
        document.getElementById(
          "answer"
        );


      if (!question) {

        answer.innerText =
          "Please ask me something.";

        return;
      }


      answer.innerText =
        "Hello Arjun! 🤖 I received your question: " +
        question;

    }


    /*
    =========================================
    START
    =========================================
    */

    checkUser();

  </script>


</body>

</html>
