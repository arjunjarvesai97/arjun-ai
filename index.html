<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arjun AI - My Personal AI Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px 20px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin: 15px 5px 0;
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      color: #fbbf24;
      min-height: 25px;
    }

    #aiBox {
      display: none;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Arjun AI</h1>
    <p>My Personal AI Assistant</p>

    <!-- LOGIN -->

    <div id="loginBox">

      <h2>Login / Sign Up</h2>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
      >

      <input
        id="password"
        type="password"
        placeholder="Enter password"
      >

      <br>

      <button type="button" id="signupBtn">
        Sign Up
      </button>

      <button type="button" id="loginBtn">
        Login
      </button>

      <div id="message"></div>

    </div>


    <!-- AI -->

    <div id="aiBox">

      <h2>Welcome to Arjun AI! 🎉</h2>

      <input
        id="question"
        type="text"
        placeholder="Ask Arjun AI something..."
      >

      <br>

      <button type="button" id="askBtn">
        Ask Arjun AI
      </button>

      <button type="button" id="logoutBtn">
        Logout
      </button>

      <div id="answer"></div>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /* =========================
       SUPABASE CONFIG
    ========================= */

    const SUPABASE_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_jaTF9qoveQieLoVNpBm_tg_BdLgm22V";

    const EDGE_FUNCTION_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co/functions/v1/clever-task";


    const client =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================
       ELEMENTS
    ========================= */

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginBox =
      document.getElementById("loginBox");

    const aiBox =
      document.getElementById("aiBox");

    const questionInput =
      document.getElementById("question");

    const answer =
      document.getElementById("answer");

    const signupBtn =
      document.getElementById("signupBtn");

    const loginBtn =
      document.getElementById("loginBtn");

    const askBtn =
      document.getElementById("askBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text) {
      message.innerText = text;
    }


    /* =========================
       SHOW AI
    ========================= */

    function showAI() {

      loginBox.style.display = "none";
      aiBox.style.display = "block";
    }


    /* =========================
       SIGN UP
    ========================= */

    async function signUp() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters."
        );

        return;
      }

      showMessage(
        "Creating account..."
      );

      try {

        const { data, error } =
          await client.auth.signUp({
            email: email,
            password: password
          });

        if (error) {

          showMessage(
            "Sign Up Error: " +
            error.message
          );

          return;
        }

        if (data.session) {

          showMessage("");
          showAI();

        } else {

          showMessage(
            "Account created. Please confirm your email."
          );
        }

      } catch (error) {

        showMessage(
          "Error: " +
          error.message
        );
      }
    }


    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;
      }

      showMessage(
        "Logging in..."
      );

      try {

        const { data, error } =
          await client.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {

          showMessage(
            "Login Error: " +
            error.message
          );

          return;
        }

        if (data && data.session) {

          showMessage("");
          showAI();

        } else {

          showMessage(
            "Login failed."
          );
        }

      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );
      }
    }


    /* =========================
       ASK ARJUN AI
    ========================= */

    async function askAI() {

      const question =
        questionInput.value.trim();

      if (!question) {

        answer.innerText =
          "Please ask me something.";

        return;
      }

      answer.innerText =
        "Thinking... 🤖";

      askBtn.disabled = true;

      try {

        /* Get logged-in user session */

        const {
          data: sessionData,
          error: sessionError
        } = await client.auth.getSession();

        if (sessionError) {

          answer.innerText =
            "Session Error: " +
            sessionError.message;

          return;
        }

        const session =
          sessionData.session;

        if (!session) {

          answer.innerText =
            "Please login first.";

          return;
        }


        /* Call Supabase Edge Function */

        const response =
          await fetch(
            EDGE_FUNCTION_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  session.access_token
              },

              body: JSON.stringify({
                question: question
              })
            }
          );


        /* Read response */

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          data = {
            error: text ||
              "Invalid response from server."
          };
        }


        /* HTTP error */

        if (!response.ok) {

          answer.innerText =
            "Function Error (" +
            response.status +
            "): " +
            (
              data.error ||
              data.message ||
              "Request failed."
            );

          return;
        }


        /* Successful AI answer */

        if (data && data.answer) {

          answer.innerText =
            data.answer;

        } else if (data && data.error) {

          answer.innerText =
            "AI Error: " +
            data.error;

        } else {

          answer.innerText =
            "No answer received from Arjun AI.";
        }

      } catch (error) {

        answer.innerText =
          "Connection Error: " +
          error.message;

      } finally {

        askBtn.disabled = false;
      }
    }


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

      try {

        await client.auth.signOut();

      } catch (error) {

        console.log(error);
      }

      loginBox.style.display =
        "block";

      aiBox.style.display =
        "none";

      passwordInput.value = "";
      questionInput.value = "";
      answer.innerText = "";

      showMessage("");
    }


    /* =========================
       CHECK SESSION
    ========================= */

    async function checkUser() {

      try {

        const { data } =
          await client.auth.getSession();

        if (
          data &&
          data.session
        ) {

          showAI();
        }

      } catch (error) {

        console.log(
          "Session error:",
          error
        );
      }
    }


    /* =========================
       BUTTON EVENTS
    ========================= */

    signupBtn.addEventListener(
      "click",
      signUp
    );

    loginBtn.addEventListener(
      "click",
      login
    );

    askBtn.addEventListener(
      "click",
      askAI
    );

    logoutBtn.addEventListener(
      "click",
      logout
    );


    /* Enter key = Ask AI */

    questionInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          event.preventDefault();

          askAI();
        }
      }
    );


    /* START */

    checkUser();

  </script>

</body>

</html>
