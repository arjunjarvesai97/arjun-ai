<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arjun AI - My Personal AI Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🤖 Arjun AI</h1>
    <p>My Personal AI Assistant</p>

    <input id="question" type="text" placeholder="Ask Arjun AI something...">

    <br>
    <button onclick="askAI()">Ask Arjun AI</button>

    <div id="answer"></div>
  </div>

  <script>
    function askAI() {
      const question = document.getElementById("question").value;
      const answer = document.getElementById("answer");

      if (question.trim() === "") {
        answer.innerText = "Please ask me something.";
        return;
      }

      answer.innerText =
        "Hello Arjun! I received your question: " + question;
    }
  </script>
</body>
</html>
