<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Arjun AI - My Personal AI Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
    }

    p {
      color: #cbd5e1;
    }

    input {
      width: 90%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      margin-top: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 13px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #aiBox {
      display: none;
    }

    #message {
      margin-top: 15px;
      color: #fbbf24;
    }

    #answer {
      margin-top: 25px;
      color: #93c5fd;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🤖 Arjun AI</h1>

    <p>My Personal AI Assistant</p>


    <!-- LOGIN BOX -->

    <div id="loginBox">

      <h2>Login / Sign Up</h2>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
      >

      <input
        id="password"
        type="password"
        placeholder="Enter password"
      >

      <br>

      <button onclick="signUp()">
        Sign Up
      </button>

      <button onclick="login()">
        Login
      </button>

      <div id="message"></div>

    </div>


    <!-- AI BOX -->

    <div id="aiBox">

      <h2>Welcome to Arjun AI! 🎉</h2>

      <input
        id="question"
        type="text"
        placeholder="Ask Arjun AI something..."
      >

      <br>

      <button onclick="askAI()">
        Ask Arjun AI
      </button>

      <button onclick="logout()">
        Logout
      </button>

      <div id="answer"></div>

    </div>

  </div>


  <!-- SUPABASE LIBRARY -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ==============================
    // SUPABASE SETTINGS
    // ==============================

    const SUPABASE_URL =
      "https://pzvqybgfndwgvmznizvj.supabase.co";


    const SUPABASE_KEY =
      "PASTE_YOUR_NEW_PUBLISHABLE_KEY_HERE";sb_publishable_jaTF9qoveQieLoVNpBm_tg_BdLgm22V



    // ==============================
    // CREATE SUPABASE CLIENT
    // ==============================

    window.arjunSupabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==============================
    // MESSAGE
    // ==============================

    function showMessage(text) {

      document.getElementById("message").innerText =
        text;

    }


    // ==============================
    // SIGN UP
    // ==============================

    async function signUp() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "Password must be at least 6 characters."
        );

        return;
      }


      showMessage(
        "Creating account..."
      );


      try {

        const { error } =
          await window.arjunSupabase.auth.signUp({

            email: email,

            password: password

          });


        if (error) {

          showMessage(
            "Sign Up Error: " +
            error.message
          );

          return;
        }


        showMessage(
          "Account created successfully!"
        );


      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );

      }

    }


    // ==============================
    // LOGIN
    // ==============================

    async function login() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Please enter email and password."
        );

        return;
      }


      showMessage(
        "Logging in..."
      );


      try {

        const result =
          await window.arjunSupabase.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        const data =
          result.data;

        const error =
          result.error;


        if (error) {

          showMessage(
            "Login Error: " +
            error.message
          );

          return;
        }


        if (data && data.session) {

          showMessage("");

          showAI();

        } else {

          showMessage(
            "Login failed. No session found."
          );

        }


      } catch (error) {

        showMessage(
          "Connection Error: " +
          error.message
        );

      }

    }


    // ==============================
    // SHOW AI
    // ==============================

    function showAI() {

      document.getElementById("loginBox")
        .style.display = "none";

      document.getElementById("aiBox")
        .style.display = "block";

    }


    // ==============================
    // LOGOUT
    // ==============================

    async function logout() {

      try {

        await window.arjunSupabase.auth.signOut();

      } catch (error) {

        console.log(error);

      }


      document.getElementById("loginBox")
        .style.display = "block";

      document.getElementById("aiBox")
        .style.display = "none";

      document.getElementById("email")
        .value = "";

      document.getElementById("password")
        .value = "";

    }


    // ==============================
    // CHECK EXISTING LOGIN
    // ==============================

    async function checkUser() {

      try {

        const { data } =
          await window.arjunSupabase.auth
            .getSession();


        if (data && data.session) {

          showAI();

        }

      } catch (error) {

        showMessage(
          "Session Error: " +
          error.message
        );

      }

    }


    // ==============================
    // ASK AI
    // ==============================

    function askAI() {

      const question =
        document.getElementById("question")
          .value
          .trim();


      const answer =
        document.getElementById("answer");


      if (!question) {

        answer.innerText =
          "Please ask me something.";

        return;
      }


      answer.innerText =
        "Hello Arjun! 🤖 I received your question: " +
        question;

    }


    // ==============================
    // START
    // ==============================

    checkUser();

  </script>

</body>
</html>
